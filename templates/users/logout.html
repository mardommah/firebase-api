{% extends 'base/layout.html' %}

{% block title %}Logout - User Management{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow text-center">
            <div class="card-body">
                <div class="mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-box-arrow-right text-primary" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M6 3.5a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-2a.5.5 0 0 0-1 0v2A1.5 1.5 0 0 0 6.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-8A1.5 1.5 0 0 0 5 3.5v2a.5.5 0 0 0 1 0v-2z"/>

                    </svg>
                </div>
                <h4 class="mb-3">Anda telah logout</h4>
                <p class="text-muted">Terima kasih telah berkunjung. Sampai jumpa lagi!</p>
                <div class="d-grid gap-2">
                    <a href="/login" class="btn btn-primary">Login Kembali</a>
                    <a href="/" class="btn btn-outline-secondary">Ke Beranda</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
