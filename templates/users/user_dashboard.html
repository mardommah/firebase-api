{% extends 'base/layout.html' %}

{% block title %}User Dashboard - User Management{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">User Dashboard</h4>
            </div>
            <div class="card-body">
                <h5>Selamat datang! <small class="text-muted">({{ session.get('user_email') }})</small></h5>
                <p class="text-muted">Anda telah berhasil login.</p>
                <hr>
                <div class="mt-4">
                    <a href="/account" class="btn btn-primary me-2">
                        <i class="bi bi-person"></i> Akun Saya
                    </a>
                    <a href="/my-subjects" class="btn btn-success me-2">
                        <i class="bi bi-book"></i> Pilih Mata Pelajaran
                    </a>
                    <a href="/logout" class="btn btn-danger">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
