{% extends 'base/layout.html' %}

{% block title %}Pilih Mata Pelajaran{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Pilih Mata Pelajaran</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="/my-subjects">
                    <div class="mb-3">
                        <label class="form-label">Pilih mata pelajaran yang ingin diambil:</label>
                        <div class="list-group">
                            {% for subject in subjects %}
                            <label class="list-group-item">
                                <input class="form-check-input me-1" type="checkbox" name="subjects" value="{{ subject.id }}" {% if subject.id in selected_ids %}checked{% endif %}>
                                <strong>{{ subject.kode }}</strong> - {{ subject.nama }} ({{ subject.sks }} SKS, Semester {{ subject.semester }})
                            </label>
                            {% endfor %}
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-save"></i> Simpan Pilihan
                        </button>
                        <a href="/user/dashboard" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Kembali
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
